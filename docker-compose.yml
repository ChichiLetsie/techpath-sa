#version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: techpath_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techpath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techpath_secret}
      POSTGRES_DB: ${POSTGRES_DB:-techpath_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techpath} -d ${POSTGRES_DB:-techpath_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: techpath_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-techpath}:${POSTGRES_PASSWORD:-techpath_secret}@db:5432/${POSTGRES_DB:-techpath_db}
    depends_on:
      db:
        condition: service_healthy
    volumes:
    - ./backend:/app
    - ./data:/app/data
    - ./scrapers:/app/scrapers
    - ./pipeline:/app/pipeline

volumes:
  postgres_data: